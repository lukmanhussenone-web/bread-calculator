<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e4ebf4">
  <title>Bread Carton Calculator</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #26364a;
      --muted: #65758b;
      --panel: #f8fafd;
      --canvas: #e4ebf4;
      --line: #cbd7e5;
      --blue: #2868b5;
      --blue-strong: #3478c8;
      --blue-soft: #e7f0fb;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: var(--canvas); color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .site-header { border-bottom: 1px solid var(--line); background: #edf2f8; }
    .header-inner, .page, .footer-inner { width: min(940px, calc(100% - 32px)); margin: 0 auto; }
    .header-inner { min-height: 58px; display: flex; align-items: center; gap: 10px; color: #233750; font-size: 1rem; font-weight: 750; }
    .bread-mark { display: grid; width: 34px; height: 34px; place-items: center; border: 1px solid #c7d7e9; border-radius: 10px; background: #dce8f6; font-size: 18px; }
    .page { flex: 1; padding: 26px 0 32px; }
    .calculator { overflow: hidden; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); box-shadow: 0 12px 32px #263e5810; }
    .card-head { padding: 17px 20px 14px; border-bottom: 1px solid var(--line); }
    .card-head h1 { margin: 0; font-size: 1.18rem; letter-spacing: -.025em; }
    .picker { padding: 16px 20px 18px; }
    .picker-title { margin: 0 0 10px; color: var(--muted); font-size: .78rem; font-weight: 700; }
    .product-options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .product-option { min-height: 58px; display: flex; align-items: center; gap: 10px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 10px; background: #f1f5fa; cursor: pointer; transition: border-color .15s, background .15s, transform .15s; }
    .product-option:hover { border-color: #9db9db; transform: translateY(-1px); }
    .product-option.selected { border-color: #78a8df; background: #e5effb; }
    .product-option.added { opacity: .5; cursor: default; }
    .product-option.added:hover { border-color: var(--line); transform: none; }
    .product-option input { width: 17px; height: 17px; margin: 0; accent-color: var(--blue-strong); flex: 0 0 auto; }
    .option-name { display: block; font-size: .88rem; font-weight: 700; }
    .option-capacity { display: block; margin-top: 3px; color: var(--muted); font-size: .73rem; }
    .picker-actions { display: flex; justify-content: flex-end; margin-top: 12px; }
    .add-button { min-height: 40px; padding: 0 15px; border: 0; border-radius: 8px; background: var(--blue-strong); color: #fff; font-weight: 750; transition: background .15s, transform .15s; }
    .add-button:hover:not(:disabled) { background: #2868b5; transform: translateY(-1px); }
    .add-button:disabled { cursor: not-allowed; opacity: .45; }
    .items { display: flex; flex-direction: column; gap: 10px; padding: 14px 20px 0; }
    .item { display: grid; grid-template-columns: minmax(150px, 1.2fr) minmax(95px, .7fr) minmax(115px, .8fr) minmax(145px, 1fr) 38px; align-items: end; gap: 11px; padding: 14px; border: 1px solid #c6d6e8; border-radius: 12px; background: #f1f5fa; box-shadow: 0 4px 12px #34557812; }
    .field { min-width: 0; }
    .field label { display: block; margin-bottom: 5px; color: var(--muted); font-size: .72rem; font-weight: 700; }
    .field input { width: 100%; height: 40px; padding: 0 10px; border: 1px solid #c3d0df; border-radius: 8px; outline: none; background: #fff; color: var(--ink); }
    .field input:focus { border-color: #6ea2dc; box-shadow: 0 0 0 3px #4c8edc1c; }
    .product-name, .capacity-value { min-height: 40px; display: flex; align-items: center; font-weight: 700; }
    .capacity-value { color: var(--muted); font-weight: 600; }
    .result { min-height: 40px; display: flex; flex-direction: row; flex-wrap: nowrap; align-items: center; gap: 8px; padding: 0 9px; border-radius: 8px; background: var(--blue-soft); font-weight: 700; white-space: nowrap; }
    .carton-count { color: var(--blue); }
    .result small { color: var(--muted); font-size: .78rem; }
    .remove-button { width: 36px; height: 36px; margin-bottom: 2px; border: 1px solid var(--line); border-radius: 8px; background: #f8fafd; color: var(--muted); font-size: 1.1rem; }
    .remove-button:hover { border-color: #e4b7c0; background: #fff4f5; color: #a63d54; }
    .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 30px 20px 18px; padding: 15px; border: 1px solid #b9cde3; border-radius: 13px; background: #dce8f6; box-shadow: 0 5px 16px #34557812; }
    .summary[hidden], .items[hidden] { display: none; }
    .summary-card { min-width: 0; padding: 12px 14px; border: 1px solid #c6d6e8; border-radius: 9px; background: #f1f5fa; }
    .summary-card span { display: block; color: var(--muted); font-size: .75rem; font-weight: 650; }
    .summary-card strong { display: block; margin-top: 4px; font-size: 1.3rem; }
    .summary-card.highlight { border-color: #a9c5e4; background: #e7f0fb; }
    .summary-card.highlight strong { color: var(--blue); }
    .site-footer { border-top: 1px solid var(--line); background: #e9eff6; }
    .footer-inner { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 9px 0 8px; text-align: center; }
    .developer-label { display: block; margin-bottom: 2px; color: var(--muted); font-size: .65rem; letter-spacing: .09em; text-transform: uppercase; }
    .developer-name { font-size: 1rem; line-height: 1.25; font-weight: 750; }
    .contact-link { display: inline-flex; align-items: center; justify-content: center; gap: 6px; max-width: 100%; padding: 5px 9px; border: 1px solid #c2d3e7; border-radius: 7px; background: #e1ebf7; color: #285d99; font-size: .9rem; line-height: 1.25; font-weight: 650; text-decoration: none; overflow-wrap: anywhere; transition: background .15s, border-color .15s; }
    .contact-link:hover { border-color: #a7c3e3; background: #d9e7f7; }
    .footer-copy { margin: 0; color: #74839a; font-size: .68rem; }
    @media (max-width: 700px) {
      .page { padding-top: 18px; }
      .item { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.2fr) 36px; gap: 9px; align-items: end; }
      .item .name-field { grid-column: 1 / 4; }
      .item .units-field { grid-column: 1; grid-row: 2; }
      .item .capacity-field { grid-column: 2; grid-row: 2; }
      .item .result-field { grid-column: 3; grid-row: 2; }
      .item .remove-button { grid-column: 4; grid-row: 1; align-self: start; margin: 0; }
      .result { flex-direction: row; flex-wrap: nowrap; gap: 6px; padding: 0 7px; font-size: .82rem; }
      .summary { grid-template-columns: 1fr; margin: 30px 14px 14px; padding: 12px; }
    }
    @media (max-width: 480px) {
      .header-inner, .page, .footer-inner { width: calc(100% - 22px); }
      .header-inner { min-height: 54px; }
      .page { padding-top: 13px; padding-bottom: 20px; }
      .card-head { padding: 14px; }
      .picker { padding: 13px 14px 15px; }
      .items { padding: 12px 14px 0; }
      .product-options { gap: 7px; }
      .product-option { min-height: 54px; gap: 8px; padding: 7px; }
      .option-name { font-size: .8rem; }
      .footer-inner { gap: 4px; padding: 8px 0 7px; }
      .developer-name, .contact-link { font-size: .9rem; }
    }
    @media (max-width: 360px) {
      .product-options { grid-template-columns: 1fr; }
      .picker-actions .add-button { width: 100%; }
      .item { grid-template-columns: minmax(0, .9fr) minmax(0, .9fr) minmax(0, 1.2fr) 32px; gap: 6px; padding: 10px; }
      .result { gap: 4px; padding: 0 5px; font-size: .74rem; }
      .field label { font-size: .66rem; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner"><span class="bread-mark" aria-hidden="true">🍞</span><span>Bread Cartons</span></div>
  </header>
  <main class="page">
    <section class="calculator" aria-labelledby="calculator-title">
      <header class="card-head"><h1 id="calculator-title">Packing list</h1></header>
      <div class="picker">
        <p class="picker-title">Choose bread types</p>
        <div class="product-options" id="product-options"></div>
        <div class="picker-actions"><button class="add-button" id="add-items" type="button" disabled>Add selected</button></div>
      </div>
      <div class="items" id="items" aria-live="polite" hidden></div>
      <section class="summary" id="summary" aria-label="Packing totals" hidden>
        <div class="summary-card"><span>Total units</span><strong id="total-units">0</strong></div>
        <div class="summary-card highlight"><span>Full cartons</span><strong id="total-cartons">0</strong></div>
        <div class="summary-card"><span>Left over</span><strong id="total-leftover">0</strong></div>
      </section>
    </section>
  </main>
  <footer class="site-footer">
    <div class="footer-inner">
      <div class="developer-info"><span class="developer-label">Developed by</span><div class="developer-name">Md Lukman Hussen</div></div>
      <a class="contact-link" href="mailto:lukmanverse.6@gmail.com"><span aria-hidden="true">✉</span><span>lukmanverse.6@gmail.com</span></a>
      <p class="footer-copy">Bread Carton Calculator</p>
    </div>
  </footer>

  <template id="item-template">
    <div class="item">
      <div class="field name-field"><div class="product-name"></div></div>
      <div class="field units-field"><label>Units</label><input class="units" type="number" min="0" step="1" inputmode="numeric" aria-label="Number of units"></div>
      <div class="field capacity-field"><label>Per carton</label><div class="capacity-value"></div></div>
      <div class="field result-field"><label>Result</label><div class="result"><span class="carton-count">0 cartons</span><small>·</small><span class="leftover-count">0 left</span></div></div>
      <button class="remove-button" type="button" aria-label="Remove bread type">×</button>
    </div>
  </template>
  <script>
    (() => {
      const products = [
        { name: 'Any Time Bread', capacity: 44 },
        { name: 'S Bread', capacity: 80 },
        { name: 'Banana Bread', capacity: 16 },
        { name: 'Sandwich Bread', capacity: 16 },
        { name: 'Morning Bread', capacity: 60 },
        { name: 'Fruit Bread', capacity: 24 },
        { name: 'White Bread', capacity: 29 },
        { name: 'XL Bread', capacity: 24 }
      ];
      const list = document.querySelector('#items');
      const summary = document.querySelector('#summary');
      const options = document.querySelector('#product-options');
      const addButton = document.querySelector('#add-items');
      const template = document.querySelector('#item-template');
      const number = value => Math.max(0, Math.floor(Number(value) || 0));
      const rows = new Map();

      function renderOptions() {
        options.replaceChildren();
        products.forEach((product, index) => {
          const label = document.createElement('label');
          label.className = 'product-option';
          label.dataset.product = String(index);
          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.value = String(index);
          checkbox.setAttribute('aria-label', `Select ${product.name}`);
          const text = document.createElement('span');
          text.innerHTML = `<span class="option-name"></span><span class="option-capacity"></span>`;
          text.querySelector('.option-name').textContent = product.name;
          text.querySelector('.option-capacity').textContent = `${product.capacity} per carton`;
          checkbox.addEventListener('change', () => {
            label.classList.toggle('selected', checkbox.checked);
            updateAddButton();
          });
          label.append(checkbox, text);
          options.append(label);
        });
      }

      function updateAddButton() {
        addButton.disabled = !options.querySelector('input:checked');
      }

      function updateOptionStates() {
        options.querySelectorAll('.product-option').forEach(label => {
          const added = rows.has(Number(label.dataset.product));
          const checkbox = label.querySelector('input');
          label.classList.toggle('added', added);
          checkbox.disabled = added;
          if (added) {
            checkbox.checked = false;
            label.classList.remove('selected');
          }
        });
        updateAddButton();
      }

      function calculate() {
        let totalUnits = 0;
        let totalCartons = 0;
        let totalLeftover = 0;
        [...rows.entries()].forEach(([index, row], position) => {
          const units = number(row.querySelector('.units').value);
          const capacity = products[index].capacity;
          const cartons = Math.floor(units / capacity);
          const leftover = units % capacity;
          row.querySelector('.product-name').textContent = `${position + 1}. ${products[index].name}`;
          row.querySelector('.carton-count').textContent = `${cartons} ${cartons === 1 ? 'carton' : 'cartons'}`;
          row.querySelector('.leftover-count').textContent = `${leftover} left`;
          totalUnits += units;
          totalCartons += cartons;
          totalLeftover += leftover;
        });
        const hasItems = rows.size > 0;
        list.hidden = !hasItems;
        summary.hidden = !hasItems;
        document.querySelector('#total-units').textContent = totalUnits.toLocaleString();
        document.querySelector('#total-cartons').textContent = totalCartons.toLocaleString();
        document.querySelector('#total-leftover').textContent = totalLeftover.toLocaleString();
      }

      function addProduct(index) {
        const product = products[index];
        if (!product || rows.has(index)) return;
        const row = template.content.firstElementChild.cloneNode(true);
        row.querySelector('.product-name').textContent = product.name;
        row.querySelector('.units').value = '1';
        row.querySelector('.capacity-value').textContent = product.capacity;
        row.addEventListener('input', calculate);
        row.querySelector('.remove-button').addEventListener('click', () => {
          row.remove();
          rows.delete(index);
          updateOptionStates();
          calculate();
        });
        rows.set(index, row);
        list.append(row);
      }

      renderOptions();
      addButton.addEventListener('click', () => {
        const selected = [...options.querySelectorAll('input:checked')].map(input => Number(input.value));
        selected.forEach(addProduct);
        updateOptionStates();
        calculate();
      });
    })();
  </script>
</body>
</html>
